# ===== BANCO DE DADOS =====
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/filmes_db}spring.datasource.username=postgres
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# update = cria/atualiza tabelas automaticamente
# create = recria tudo ao iniciar (cuidado!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
# false = hot reload em desenvolvimento

# ===== SERVIDOR =====
server.port=8080

# Render.com injeta essas variáveis automaticamente
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Porta dinâmica do Render
server.port=${PORT:8080}