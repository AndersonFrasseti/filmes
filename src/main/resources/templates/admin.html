<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Painel Admin')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: mensagens}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h2>⚙️ Painel Admin</h2>
        <a th:href="@{/cadastro}" class="btn btn-success">+ Novo Filme</a>
    </div>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Título</th><th>Status</th><th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="filme : ${filmes}"
        <!-- classe visual: cinza se deletado -->
        th:class="${filme.isDeleted != null} ? 'table-secondary' : ''">
        <td th:text="${filme.id}"></td>
        <td th:text="${filme.titulo}"></td>
        <td>
                    <span th:if="${filme.isDeleted == null}"
                          class="badge bg-success">Ativo</span>
            <span th:unless="${filme.isDeleted == null}"
                  class="badge bg-secondary">Deletado</span>
        </td>
        <td>
            <a th:href="@{/editar(id=${filme.id})}"
               class="btn btn-sm btn-warning">✏️ Editar</a>
            <a th:if="${filme.isDeleted == null}"
               th:href="@{/deletar(id=${filme.id})}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('Deletar?')">🗑️ Deletar</a>
            <a th:unless="${filme.isDeleted == null}"
               th:href="@{/restaurar(id=${filme.id})}"
               class="btn btn-sm btn-info">♻️ Restaurar</a>
        </td>
        </tr>
        </tbody>
    </table>
</div>
<footer th:replace="~{layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
