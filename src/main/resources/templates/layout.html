<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- FRAGMENTO: HEAD dinâmico com título como parâmetro -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <title th:text=${titulo}}>Filmes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<!-- FRAGMENTO: NAVBAR com thymeleaf security -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"
     th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">🎬 CineApp</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Início</a>
            <a class="nav-link" sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin}">Admin</a>
            <!-- Exibe o usuário logado — questão 16 -->
            <span class="nav-link text-warning"
                  sec:authorize="isAuthenticated()">
                👤 <span sec:authentication="name"></span>
            </span>
            <a class="nav-link"
               th:href="@{/logout}">Sair</a>
        </div>
    </div>
</nav>

<!-- FRAGMENTO: FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5"
        th:fragment="footer">
    <p>© 2026 CineApp — UFRN/EAJ</p>
</footer>

<!-- FRAGMENTO: Mensagens Flash — questão 19 -->
<div th:fragment="mensagens">
    <div class="container mt-2">
        <div th:if="${mensagemSucesso}"
             class="alert alert-success alert-dismissible fade show">
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${mensagemErro}"
             class="alert alert-danger alert-dismissible fade show">
            <span th:text="${mensagemErro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
</div>

</html>
