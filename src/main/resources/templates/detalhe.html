<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Detalhes do Filme')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-4">
            <img th:src="@{${filme.imageUrl}}"
                 class="img-fluid rounded shadow">
        </div>
        <div class="col-md-8">
            <h1 th:text="${filme.titulo}"></h1>
            <p><strong>Diretor:</strong>
                <span th:text="${filme.diretor}"></span></p>
            <p><strong>Gênero:</strong>
                <span th:text="${filme.genero}"></span></p>
            <p><strong>Ano:</strong>
                <span th:text="${filme.anoLancamento}"></span></p>
            <p><strong>Duração:</strong>
                <span th:text="${filme.duracao} + ' min'"></span></p>
            <p><strong>Classificação:</strong>
                <span th:text="${filme.classificacaoIndicativa}"></span></p>
            <hr>
            <p th:text="${filme.sinopse}"></p>
            <a th:href="@{/adicionarCarrinho(id=${filme.id})}"
               class="btn btn-success">+ Adicionar ao Carrinho</a>
            <a th:href="@{/index}" class="btn btn-secondary">← Voltar</a>
        </div>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
